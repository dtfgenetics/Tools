name: Canonical tool ownership guard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-canonical-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate complete canonical tool suite
        run: npm test
      - name: Prevent reverse migration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"sourceOfTruth": "dtfgenetics/Tools"' migration/manifest.json
          echo "Tools remains canonical; THC is integration/deployment mirror only."
