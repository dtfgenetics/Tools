name: Atlas Evidence Intake Release
on:
  pull_request:
    paths:
      - 'site/public-route-patch/atlas/diagnostics/**'
      - 'scripts/test-atlas-evidence-intake-release.mjs'
      - '.github/workflows/atlas-evidence-intake-release.yml'
  push:
    branches: [main]
    paths:
      - 'site/public-route-patch/atlas/diagnostics/**'
      - 'scripts/test-atlas-evidence-intake-release.mjs'
      - '.github/workflows/atlas-evidence-intake-release.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Atlas intake release contract
        run: node scripts/test-atlas-evidence-intake-release.mjs
