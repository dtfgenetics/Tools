name: Full Tools deterministic suite

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'site/**'
      - 'package.json'
      - '.github/workflows/full-tools-suite-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-tools-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run full deterministic repository suite
        run: npm test
