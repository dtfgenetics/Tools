name: Core educational calculator browser checks
on:
  pull_request:
    paths:
      - 'site/public-route-patch/**'
      - 'scripts/test-core-calculators-browser.mjs'
      - '.github/workflows/core-calculators-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calculators:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - run: npm install --no-save --package-lock=false --ignore-scripts puppeteer-core@24.20.0
      - name: Verify desktop and mobile calculator results
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site/public-route-patch > "$RUNNER_TEMP/tools-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/ >/dev/null
          node scripts/test-core-calculators-browser.mjs
