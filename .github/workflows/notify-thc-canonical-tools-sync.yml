name: Notify THC canonical Tools sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify-thc-canonical-tools-sync
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Detect event-driven handoff availability
        id: handoff
        env:
          DTF_THC_SYNC_TOKEN: ${{ secrets.DTF_THC_SYNC_TOKEN }}
        run: |
          if [ -n "${DTF_THC_SYNC_TOKEN}" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::DTF_THC_SYNC_TOKEN is not configured; THC's scheduled canonical sync remains the recovery path."
          fi

      - name: Dispatch canonical sync to THC
        if: steps.handoff.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.DTF_THC_SYNC_TOKEN }}
          TOOLS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api --method POST             -H "Accept: application/vnd.github+json"             /repos/dtfgenetics/Thc/dispatches             -f event_type='sync-canonical-tools'             -f "client_payload[tools_sha]=${TOOLS_SHA}"

      - name: Record handoff
        if: steps.handoff.outputs.available == 'true'
        run: echo "Requested THC canonical Tools sync for ${GITHUB_SHA}."

      - name: Record scheduled-fallback handoff
        if: steps.handoff.outputs.available != 'true'
        run: echo "Event dispatch unavailable; THC's 15-minute scheduled sync will consume canonical Tools main."
